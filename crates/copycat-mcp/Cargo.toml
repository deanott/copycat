[package]
name = "copycat-mcp"
description = "The copycat MCP server: exposes the temporal clipboard to Claude over stdio. Talks to copycatd over local IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
debug-unsafe = ["copycat-core/debug-unsafe"]

[dependencies]
copycat-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# rmcp = the official modelcontextprotocol/rust-sdk. Only the stdio transport
# (`transport-io`) is enabled.
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars = "1"
