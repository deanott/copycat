# Dependabot opens the update PRs. Without this file the repo gets security
# ALERTS only, which is how a fixed advisory (wayland-scanner 0.31.11, shipping
# quick-xml 0.41) sat unnoticed for weeks: nothing was watching for the release
# that closed it.
#
# Monthly and heavily grouped: patch and minor land as one sweep, so only a
# major gets a PR of its own. Cargo.lock is committed and CI builds --locked,
# so every one of these is a lockfile diff that the full pipeline gates.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # egui/eframe move as a family and set the MSRV (1.95 today), so a bump
      # here is a workspace-wide decision. Grouping keeps it to one PR.
      gui:
        patterns: ["egui*", "eframe", "epaint", "emath", "ecolor", "tray-icon", "muda", "gtk*", "glib*"]
      wayland-x11:
        patterns: ["wayland*", "smithay*", "x11*", "winit", "glutin*", "arboard"]
      patch-sweep:
        update-types: ["patch", "minor"]

  # The workflows pin actions by major tag, so this catches the ones that move
  # underneath us (checkout, cargo-deny-action, action-gh-release).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    ignore:
      # The msrv job pins this action to the exact toolchain in the root
      # Cargo.toml's rust-version. Dependabot reads that pin as a version to
      # chase, so a bump here silently stops the job testing the floor. The
      # MSRV moves when egui moves, by hand, in the same commit as Cargo.toml.
      - dependency-name: "dtolnay/rust-toolchain"
