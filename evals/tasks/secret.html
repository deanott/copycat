<!doctype html>
<html><head><meta charset="utf-8"><title>secret (seed 0)</title>
<style>
 body{font-family:system-ui,sans-serif;margin:2rem;max-width:640px}
 h1{font-size:1.1rem} .panel{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}
 .row{display:flex;gap:.75rem;align-items:center;margin:.35rem 0}
 .lbl{width:6rem;color:#555;font-size:.85rem}
 .src{font-family:monospace;background:#f4f4f4;padding:.15rem .4rem;border-radius:4px}
 input{flex:1;padding:.3rem .4rem;font-family:monospace}
 button{padding:.4rem .9rem;margin-top:.5rem}
 #status{margin-top:.6rem;font-family:monospace}
</style></head>
<body>
<h1>Task: secret — move source values into the form and submit</h1>
<div class="panel"><strong>Source</strong><div class="row"><span class="lbl">apikey</span><span class="src" id="src-apikey">sk-2yW4Acq9GFz6Y1t9EwL56nGisiWgNZq6</span></div></div>
<div class="panel"><strong>Target form</strong><div class="row"><label class="lbl" for="tgt-apikey">apikey</label><input type="password" id="tgt-apikey" autocomplete="off"></div>
  <button id="submit" type="button">Submit</button>
  <div id="status">unsubmitted</div>
</div>
<script>
 window.__TASK = {"name": "secret", "shape": "form", "fields": [{"key": "apikey", "value": "sk-2yW4Acq9GFz6Y1t9EwL56nGisiWgNZq6", "source_sel": "#src-apikey", "target_sel": "#tgt-apikey", "secret": true}], "targets": [{"key": "apikey", "sel": "#tgt-apikey"}], "submit_sel": "#submit", "secret": true, "check": "exact", "expected": {"apikey": "sk-2yW4Acq9GFz6Y1t9EwL56nGisiWgNZq6"}};
 window.__SUBMITTED = null;
 window.__DONE = false;
 document.getElementById('submit').addEventListener('click', function() {
   var out = {};
   window.__TASK.fields.forEach(function(f) {
     out[f.key] = document.getElementById('tgt-' + f.key).value;
   });
   window.__SUBMITTED = out;
   window.__DONE = true;
   document.getElementById('status').textContent = 'submitted';
 });
</script>
