<!doctype html>
<html><head><meta charset="utf-8"><title>profile (seed 0)</title>
<style>
 body{font-family:system-ui,sans-serif;margin:2rem;max-width:640px}
 h1{font-size:1.1rem} .panel{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}
 .row{display:flex;gap:.75rem;align-items:center;margin:.35rem 0}
 .lbl{width:6rem;color:#555;font-size:.85rem}
 .src{font-family:monospace;background:#f4f4f4;padding:.15rem .4rem;border-radius:4px}
 input{flex:1;padding:.3rem .4rem;font-family:monospace}
 button{padding:.4rem .9rem;margin-top:.5rem}
 #status{margin-top:.6rem;font-family:monospace}
</style></head>
<body>
<h1>Task: profile — move source values into the form and submit</h1>
<div class="panel"><strong>Source</strong><div class="row"><span class="lbl">name</span><span class="src" id="src-name">Ken Thompson</span></div><div class="row"><span class="lbl">email</span><span class="src" id="src-email">ken.thompson@example.com</span></div><div class="row"><span class="lbl">phone</span><span class="src" id="src-phone">+1-630-241-5242</span></div><div class="row"><span class="lbl">address</span><span class="src" id="src-address">8386 Cedar St, Ashland</span></div></div>
<div class="panel"><strong>Target form</strong><div class="row"><label class="lbl" for="tgt-name">name</label><input type="text" id="tgt-name" autocomplete="off"></div><div class="row"><label class="lbl" for="tgt-email">email</label><input type="text" id="tgt-email" autocomplete="off"></div><div class="row"><label class="lbl" for="tgt-phone">phone</label><input type="text" id="tgt-phone" autocomplete="off"></div><div class="row"><label class="lbl" for="tgt-address">address</label><input type="text" id="tgt-address" autocomplete="off"></div>
  <button id="submit" type="button">Submit</button>
  <div id="status">unsubmitted</div>
</div>
<script>
 window.__TASK = {"name": "profile", "shape": "form", "fields": [{"key": "name", "value": "Ken Thompson", "source_sel": "#src-name", "target_sel": "#tgt-name", "secret": false}, {"key": "email", "value": "ken.thompson@example.com", "source_sel": "#src-email", "target_sel": "#tgt-email", "secret": false}, {"key": "phone", "value": "+1-630-241-5242", "source_sel": "#src-phone", "target_sel": "#tgt-phone", "secret": false}, {"key": "address", "value": "8386 Cedar St, Ashland", "source_sel": "#src-address", "target_sel": "#tgt-address", "secret": false}], "targets": [{"key": "name", "sel": "#tgt-name"}, {"key": "email", "sel": "#tgt-email"}, {"key": "phone", "sel": "#tgt-phone"}, {"key": "address", "sel": "#tgt-address"}], "submit_sel": "#submit", "secret": false, "check": "exact", "expected": {"name": "Ken Thompson", "email": "ken.thompson@example.com", "phone": "+1-630-241-5242", "address": "8386 Cedar St, Ashland"}};
 window.__SUBMITTED = null;
 window.__DONE = false;
 document.getElementById('submit').addEventListener('click', function() {
   var out = {};
   window.__TASK.fields.forEach(function(f) {
     out[f.key] = document.getElementById('tgt-' + f.key).value;
   });
   window.__SUBMITTED = out;
   window.__DONE = true;
   document.getElementById('status').textContent = 'submitted';
 });
</script>
</body></html>
